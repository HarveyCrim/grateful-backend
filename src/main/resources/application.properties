spring.application.name=grateful-backend
spring.datasource.username=grateful
spring.datasource.password=grateful
spring.jpa.hibernate.dll-auto=validate
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:postgresql://localhost:5432/grateful
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes-or-more}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d
